# Blueprint de Render: el servidor Express de SIGNAL, detrás de Cloudflare Pages.
# Guía completa: docs/cloudflare-pages.md
#
# Render → New → Blueprint → este repositorio. Las variables con `sync: false`
# se piden al crear el Blueprint: nunca se escriben en este archivo.
services:
  - type: web
    name: signal-api
    runtime: node
    # Gratis: se suspende tras 15 minutos sin peticiones y tarda cerca de un minuto
    # en despertar. Para que la app Android no espere, un monitor externo puede
    # llamar a /api/health/live cada 5 minutos (docs/cloudflare-pages.md, paso 4.1).
    # El plan gratis no tiene disco ni preDeployCommand.
    plan: free
    # Render no tiene región en Sudamérica: Virginia es la más cercana a Supabase São Paulo.
    region: virginia
    # Producción se despliega solo desde main, y solo si el CI de GitHub pasó.
    branch: main
    autoDeployTrigger: checksPass
    # NODE_ENV=production haría que npm omita las devDependencies que el build necesita.
    # Las migraciones van al final del build (usan DIRECT_URL): si fallan, el
    # despliegue se cancela y sigue la versión anterior.
    buildCommand: npm ci --include=dev && npm run build && npm run db:deploy
    startCommand: npm start
    # Solo comprueba que el proceso responde: si Supabase cae, Render no reinicia el
    # servidor y la app Android sigue respondiendo desde el snapshot.
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      # Contrato de la app Android: el servidor escucha en el 3000.
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_BUCKET
        value: media
      # Sin disco, los respaldos se borrarían en cada despliegue o pausa: se hacen
      # desde un computador con `npm run backup`. El snapshot de beacons se
      # regenera al arrancar.
      - key: BACKUP_INTERVAL_HOURS
        value: "0"
      # Render genera valores aleatorios y distintos entre sí.
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      # Se piden al crear el Blueprint.
      - key: ADMIN_PATH
        sync: false
      - key: EDGE_PROXY_SECRET
        sync: false
      - key: SITE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
